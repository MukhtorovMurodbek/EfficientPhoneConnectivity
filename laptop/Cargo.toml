[package]
name = "epcd"
version = "0.1.0"
edition = "2024"

[dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd", "rfcomm"] }
futures-util = "0.3.34"
ksni = "0.3.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "io-util", "signal", "net"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
